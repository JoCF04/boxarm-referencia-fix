<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Pallet</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
{% from "components/camera_card.html" import camera_card %}
<body>
  <header class="dashboard-header">
    <nav class="modes" aria-label="modo de visualización">
      <button class="mode active" data-mode="iso">RESUMEN</button>
      <button class="mode" data-mode="camera">CÁMARAS</button>
      <button class="mode" data-mode="inspection">INSPECCIÓN</button>
    </nav>
  </header>
  <main>
    {% if cameras|length == 3 %}
    {% include "components/puzzle_grid.html" %}
    {% else %}
    <div id="camera-grid" class="camera-grid">
      {% for camera in cameras %}
      {{ camera_card(camera) }}
      {% endfor %}
    </div>
    {% endif %}
    <div id="inspection-view" class="inspection-view" hidden>
      <iframe id="inspection-frame" title="inspección"></iframe>
      <nav class="camera-picker" aria-label="elegir cámara">
        {% for camera in cameras %}
        <button data-camera-id="{{ camera.id }}">{{ camera.tag }}</button>
        {% endfor %}
      </nav>
    </div>
  </main>
  <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
